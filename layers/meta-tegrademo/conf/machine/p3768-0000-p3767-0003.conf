#@TYPE: Machine
#@NAME: Nvidia Jetson Orin Nano 8GB (P3767-0003)
#@DESCRIPTION: Nvidia Jetson Orin Nano 8G module in P3768 carrier
TEGRA_FLASHVAR_BPFDTB_FILE ?= "tegra234-bpmp-3767-0003-3768-super.dtb"
KERNEL_ARGS ?= "mminit_loglevel=4 console=ttyTCU0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb video=efifb:off console=tty0 net.ifnames=0 systemd.gpt_auto=0 audit=0"

TEGRA_FAB ?= "300"
TEGRA_BOARDSKU ?= "0003"
TEGRA_BOARDREV ?= "P.1"

TEGRA_BUPGEN_SPECS ?= "fab=300;boardsku=0003;boardrev=;chipsku=00:00:00:D5;bup_type=bl \
                       fab=300;boardsku=0003;boardrev=;bup_type=kernel"

TNSPEC_BOOTDEV ?= "nvme0n1p1"
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"
TEGRAFLASH_NO_INTERNAL_STORAGE = "1"

MACHINEOVERRIDES =. "p3767-0003:"

KERNEL_DEVICETREE ?= "tegra234-p3768-0000+p3767-0003-nv-super.dtb"
require conf/machine/include/orin-nano.inc
require conf/machine/include/p3768.inc

# The Seeed J401 carrier uses the same Realtek RTL8111/8168 PCIe Gigabit NIC
# as the stock NVIDIA P3768 dev kit (verified via lspci on the J401:
# "0008:01:00.0 Ethernet controller: Realtek ... RTL8111/8168/8211/8411 PCI
# Express Gigabit"). It does NOT route the Tegra SoC's EQOS or MGBE MACs to an
# external PHY, so the SoC-ethernet driver stack (nvethernet / dwmac-tegra /
# stmmac / realtek-phy) is irrelevant here. meta-tegra's p3768.inc already
# pulls the correct driver set via DEVKIT_ETHERNET_RRECOMMENDS; do NOT override
# it.
#
# Under TEGRA_USING_VENDOR_KERNEL=1 (linux-noble-nvidia-tegra), the stock
# value resolves to:
#   nv-kernel-module-r8168  (NVIDIA OOT r8168 driver)
#   kernel-module-realtek   (Realtek PHY helper, redundant but harmless)
#   linux-firmware-rtl8168  (NIC firmware blob)
