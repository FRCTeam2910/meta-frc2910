# NetworkManager configuration for the Orin AOS image.
#
# - All ethernet/wifi/wwan interfaces are managed by NetworkManager (DHCP
#   with IPv4 link-local fallback for zero-config direct-wire SSH, IPv6 RA
#   disabled).
# - CAN interfaces (cana, canb, canc) are left UNmanaged by NM; they are
#   configured by systemd-networkd via the 80-can*.network files installed
#   by aos-configuration.
# - veth* and docker* interfaces are unmanaged (used by container runtimes).

[main]
# DNS: NM writes the DHCP-provided nameserver(s) to /etc/resolv.conf
# directly (rc-manager=file). mDNS (.local) is handled by avahi-daemon
# (pulled in transitively via packagegroup-base when the 'zeroconf' distro
# feature is on), not by systemd-resolved -- the resolved unit is never
# enabled (oe-core's 99-default.preset is 'disable *') and would default to
# mDNS=off anyway. avahi publishes the device as orin.local and libnss-mdns
# (also from avahi) makes '*.local' lookups consult it.
# Persist NM connection state across reboots.
rc-manager=file

# Explicitly mark CAN and virtual interfaces as unmanaged so NM never
# touches them (they're owned by systemd-networkd / their respective
# subsystems).
[keyfile]
unmanaged-devices=interface-name:cana;interface-name:canb;interface-name:canc;interface-name:veth*;interface-name:docker*
