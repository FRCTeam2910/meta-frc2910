# Realtek RTL8188GU / RTL8710BU USB WiFi 6 adapter support.
#
# The in-tree rtl8xxxu driver (drivers/net/wireless/realtek/rtl8xxxu/) gained
# RTL8710BU (= RTL8188GU) support in Linux 6.4, and the meta-tegra noble
# kernel is 6.8, so the support exists — but the 6.8 defconfig ships it as
# "# CONFIG_RTL8XXXU is not set". This fragment turns it on as a module so
# that after the SCSI cdrom-mode eject (see the usb-modeswitch dispatcher and
# the eject-rtl8188gu udev rule shipped in this layer) the adapter
# re-enumerates as 0bda:b711 and rtl8xxxu binds to wlan0.
#
# The matched id in drivers/net/wireless/realtek/rtl8xxxu/8710b.c is
#   USB_DEVICE_AND_INTERFACE_INFO(USB_VENDOR_ID_REALTEK, 0xb711, ...)
# so the driver only ever sees the post-switch PID, never 0bda:1a2b (which
# is a USB Mass Storage / SCSI CD class device).
#
# CONFIG_RTL8XXXU is tristate; the sub-symbols RTL8XXXU_UNTESTED and
# RTL8XXXU_TEST are bool and default off, so just =m is sufficient.
# CONFIG_CFG80211_WEXT is pulled in so wpa_supplicant / NetworkManager can
# talk to rtl8xxxu via the legacy wireless-extensions ioctls the driver
# advertises. CFG80211 itself is already on in the 6.8 defconfig.
CONFIG_RTL8XXXU=m
# Optional, off by default — leave it off:
# CONFIG_RTL8XXXU_UNTESTED=y
