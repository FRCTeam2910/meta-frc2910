# XFS filesystem support. Required because to_xfs.py converts the tegraflash
# rootfs image from ext4 (Yocto's default) to XFS (128 KiB stripe-unit aligned
# to the NVMe erase block) before flashing. Without XFS in the kernel, the
# device cannot mount its root filesystem.
#
# The 6.8 defconfig ships this as "# CONFIG_XFS_FS is not set"; this fragment
# turns it on. Built-in (=y) rather than module (=m) so the initramfs-less
# tegraflash boot can mount root without a loadable-module step.
CONFIG_XFS_FS=y
CONFIG_XFS_SUPPORT_V4=y
CONFIG_XFS_POSIX_ACL=y
CONFIG_XFS_QUOTA=y
CONFIG_XFS_RT=y
